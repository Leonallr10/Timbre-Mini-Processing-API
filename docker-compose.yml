services:
  db:
    image: postgres:16-alpine
    container_name: timbre-db
    environment:
      POSTGRES_USER: timbre
      POSTGRES_PASSWORD: timbre
      POSTGRES_DB: timbre
    ports:
      - "5432:5432"
    volumes:
      - timbre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timbre -d timbre"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: timbre-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://timbre:timbre@db:5432/timbre
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_BYTES: "104857600"
    volumes:
      - timbre_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  timbre_pgdata:
  timbre_uploads:
